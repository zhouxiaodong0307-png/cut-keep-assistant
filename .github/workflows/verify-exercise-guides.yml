name: Verify training illustration mappings
on:
  push:
    branches: [main]
    paths:
      - index.html
      - assets/**
      - scripts/verify-exercise-guides.cjs
      - scripts/verify-chest-only-day.cjs
      - scripts/verify-scientific-volume.cjs
      - scripts/verify-flexible-schedule.cjs
      - scripts/verify-training-v99.cjs
      - scripts/verify-widget-last-location.cjs
      - scripts/verify-widget-no-first-paint.cjs
      - scripts/verify-ios-widget.cjs
      - scripts/verify-widget-cloud.cjs
      - scripts/verify-retro-training-v105.cjs
      - scripts/verify-mobile-retro-v107.cjs
      - scripts/verify-swipe-plan-v109.cjs
      - scripts/verify-week-swipe-animation-v110.cjs
      - scripts/verify-swipe-reveal-v111.cjs
      - scripts/verify-swipe-visible-v112.cjs
      - cloud-sync.js
      - cloud-config.js
      - supabase/**
      - scripts/verify-cloud-sync.cjs
      - scripts/verify-cloud-session.cjs
      - scripts/verify-cloud-live.cjs
      - widgets/**
      - .github/workflows/verify-exercise-guides.yml
  pull_request:
    paths:
      - index.html
      - assets/**
      - scripts/verify-exercise-guides.cjs
      - scripts/verify-chest-only-day.cjs
      - scripts/verify-scientific-volume.cjs
      - scripts/verify-flexible-schedule.cjs
      - scripts/verify-training-v99.cjs
      - scripts/verify-widget-last-location.cjs
      - scripts/verify-widget-no-first-paint.cjs
      - scripts/verify-ios-widget.cjs
      - scripts/verify-widget-cloud.cjs
      - scripts/verify-retro-training-v105.cjs
      - scripts/verify-mobile-retro-v107.cjs
      - scripts/verify-swipe-plan-v109.cjs
      - scripts/verify-week-swipe-animation-v110.cjs
      - scripts/verify-swipe-reveal-v111.cjs
      - scripts/verify-swipe-visible-v112.cjs
      - cloud-sync.js
      - cloud-config.js
      - supabase/**
      - scripts/verify-cloud-sync.cjs
      - scripts/verify-cloud-session.cjs
      - scripts/verify-cloud-live.cjs
      - widgets/**
      - .github/workflows/verify-exercise-guides.yml
jobs:
  exercise-guide-match:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit 12 weeks and all 7 days against exact anatomy sprite panels
        run: node scripts/verify-exercise-guides.cjs
      - name: Ensure chest-only specialist day and no unrelated makeup actions
        run: node scripts/verify-chest-only-day.cjs
      - name: Validate evidence-based minimum working sets and deduplicated fatigue adjustments
        run: node scripts/verify-scientific-volume.cjs
      - name: Validate user-led cardio-to-strength day switching and recovery warnings
        run: node scripts/verify-flexible-schedule.cjs
      - name: Validate V99 progressive training stages and real muscle-group volumes
        run: node scripts/verify-training-v99.cjs
      - name: Validate widget reopen resumes previous tab, scroll and expanded panels
        run: node scripts/verify-widget-last-location.cjs
      - name: Verify no homepage paint occurs before restored widget state
        run: node scripts/verify-widget-no-first-paint.cjs
      - name: Validate retrospective training completion and schedule alignment
        run: node scripts/verify-retro-training-v105.cjs
      - name: Ensure obsolete historical form is replaced by bounded swipe action
        run: node scripts/verify-mobile-retro-v107.cjs
      - name: Validate seven-day swipe completion and truthful workout progression
        run: node scripts/verify-swipe-plan-v109.cjs
      - name: Validate finger-tracking swipe animation and reduced motion
        run: node scripts/verify-week-swipe-animation-v110.cjs
      - name: Validate colored completed and undo swipe underlays
        run: node scripts/verify-swipe-reveal-v111.cjs
      - name: Validate closed-details Safari swipe reveal visibility
        run: node scripts/verify-swipe-visible-v112.cjs
      - name: Validate actual iOS widget snapshot and Scriptable offline renderer
        run: node scripts/verify-ios-widget.cjs
      - name: Validate automatic widget cloud pairing, offline caching and new calories
        run: node scripts/verify-widget-cloud.cjs
      - name: Validate private account cloud sync and multi-device conflict prevention
        run: node scripts/verify-cloud-sync.cjs
      - name: Validate persistent Safari sessions through widget relaunch and network interruption
        run: node scripts/verify-cloud-session.cjs
      - name: Verify real backend rejects anonymous health-data access
        run: node scripts/verify-cloud-live.cjs
