<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>减脂保肌助手</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f7f4;color:#111;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.app{max-width:560px;margin:auto;padding:28px 22px 110px}h1{font-size:42px;margin:0 0 26px}.date{background:#fff;border-radius:24px;padding:10px 16px;float:right}.hero{clear:both;background:#101010;color:#fff;border-radius:32px;padding:28px;margin-top:28px}.muted{color:#999}.big{font-size:64px;font-weight:800;line-height:1.05;margin:12px 0}.bar{height:10px;background:#333;border-radius:10px;margin:20px 0 26px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:14px}.stat{background:#222;border-radius:22px;padding:18px}.stat b{display:block;font-size:28px;margin-top:6px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:18px 0}.btn{border:0;border-radius:22px;padding:20px;font-size:18px;font-weight:700;background:#fff}.btn.dark{background:#111;color:#fff}.tip,.training{border-radius:28px;padding:24px;margin-top:18px}.tip{background:#fff1c9}.training{background:#eaf5e7}.training h2{margin:6px 0 8px;font-size:28px}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;padding:14px;display:flex;justify-content:space-around}.nav b{font-size:14px}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end}.sheet{background:#fff;width:100%;max-width:560px;margin:auto;border-radius:30px 30px 0 0;padding:24px}.sheet img{width:100%;max-height:260px;object-fit:contain;border-radius:18px;background:#eee}.sheet input{width:100%;padding:14px;margin:6px 0;border:1px solid #ddd;border-radius:14px;font-size:16px}.save{width:100%;padding:18px;border:0;border-radius:18px;background:#111;color:#fff;font-size:18px;font-weight:700;margin-top:10px}</style></head><body><main class="app"><span class="date">10月6日</span><h1>今天</h1><section class="hero"><div class="muted">今天还可以吃</div><div class="big"><span id="remain">2250</span><small style="font-size:24px;color:#aaa"> kcal</small></div><div class="bar"></div><div class="stats"><div class="stat"><span class="muted">已摄入</span><b><span id="eaten">0</span> kcal</b></div><div class="stat"><span class="muted">蛋白质还差</span><b><span id="proteinLeft">155</span> g</b></div></div></section><div class="actions"><button class="btn dark" onclick="camera.click()">📷 拍照记录</button><button class="btn" onclick="gallery.click()">🖼️ 上传截图</button></div><input id="camera" hidden type="file" accept="image/*" capture="environment"><input id="gallery" hidden type="file" accept="image/*"><section class="tip"><h3>今天先保证蛋白质</h3><div class="muted">每餐优先一掌心以上的鸡肉、牛肉、鱼虾、鸡蛋或豆制品；外卖尽量少油少酱。</div></section><h2 style="margin-top:30px">今天训练</h2><section class="training"><div class="muted">周二</div><h2>Zone 2 骑车</h2><div class="muted">45–50分钟 · RPE 3–4/10</div></section></main><nav class="nav"><b>⌂<br>今天</b><b>◉<br>饮食</b><b>◆<br>训练</b><b>↗<br>进度</b></nav><div class="modal" id="modal"><div class="sheet"><h2>确认本餐</h2><img id="preview"><p class="muted">上传后会自动进行AI分析；请确认份量、热量和蛋白质后再计入。</p><input id="food" placeholder="食物名称"><input id="kcal" type="number" placeholder="热量 kcal"><input id="protein" type="number" placeholder="蛋白质 g"><button class="save" onclick="saveMeal()">确认计入今天</button></div></div><script>const target=2250,pt=155;let meals=JSON.parse(localStorage.getItem("ckMeals")||"[]");function render(){let k=meals.reduce((a,x)=>a+(+x.kcal||0),0),p=meals.reduce((a,x)=>a+(+x.protein||0),0);eaten.textContent=k;remain.textContent=Math.max(0,target-k);proteinLeft.textContent=Math.max(0,pt-p)}async function pick(e){let f=e.target.files[0];if(!f)return;preview.src=URL.createObjectURL(f);food.value="AI分析中…";kcal.value="";protein.value="";modal.style.display="flex";try{const dataUrl=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)});const resp=await fetch("https://cut-keep-assistant-api.onrender.com/api/analyze-food",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({image:dataUrl})});const d=await resp.json();if(!resp.ok)throw new Error(d.error||"分析失败");food.value=d.food+(d.portion?" · "+d.portion:"");kcal.value=d.kcal||"";protein.value=d.protein||"";document.querySelector(".sheet .muted").textContent="AI估算 · 置信度："+(d.confidence||"中")+"。"+(d.note||"请确认份量后再计入。")}catch(err){food.value="";document.querySelector(".sheet .muted").textContent="AI暂未完成："+err.message+"。你仍可手动填写后计入。"}}camera.onchange=pick;gallery.onchange=pick;modal.onclick=e=>{if(e.target===modal)modal.style.display="none"};function saveMeal(){if(!kcal.value)return alert("请填写或确认热量");meals.push({food:food.value||"本餐",kcal:+kcal.value,protein:+protein.value||0,time:Date.now()});localStorage.setItem("ckMeals",JSON.stringify(meals));modal.style.display="none";render()}render()</script></body></html>
