<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>减脂保肌助手</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f7f4;color:#111;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.app{max-width:560px;margin:auto;padding:26px 20px 108px}h1{font-size:40px;margin:0 0 24px}.date{background:#fff;border-radius:24px;padding:10px 15px;float:right;font-weight:600}.hero{clear:both;background:#101010;color:#fff;border-radius:30px;padding:26px;margin-top:24px}.muted{color:#8f8f8f}.big{font-size:60px;font-weight:800;line-height:1.05;margin:10px 0}.bar{height:10px;background:#333;border-radius:10px;margin:18px 0 24px;overflow:hidden}.bar i{display:block;height:100%;background:#fff;border-radius:10px;width:0}.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat{background:#222;border-radius:20px;padding:16px}.stat b{display:block;font-size:25px;margin-top:5px}.card{background:#fff;border-radius:26px;padding:20px;margin-top:18px}.card h2{margin:0 0 12px;font-size:24px}.foodinput{width:100%;border:1px solid #ddd;border-radius:18px;padding:16px;font-size:17px;background:#fafafa}.hint{font-size:13px;color:#8c8c8c;margin:8px 2px 0;line-height:1.5}.row{display:flex;gap:10px;margin-top:12px}.btn{border:0;border-radius:18px;padding:16px 18px;font-size:17px;font-weight:700;flex:1;background:#eee}.btn.dark{background:#111;color:#fff}.result{display:none;margin-top:16px;border-radius:20px;padding:18px;background:#f1f5ee}.result .tag{display:inline-block;border-radius:999px;padding:6px 10px;background:#111;color:#fff;font-size:13px;font-weight:700}.result h3{font-size:24px;margin:10px 0 6px}.macro{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.macro div{background:#fff;border-radius:15px;padding:12px;text-align:center}.macro b{display:block;font-size:19px}.list{margin-top:12px}.meal{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-top:1px solid #eee;gap:12px}.meal:first-child{border-top:0}.meal strong{display:block}.meal small{color:#888}.del{border:0;background:#f1f1f1;border-radius:12px;padding:8px 10px}.tip{background:#fff1c9}.training{background:#eaf5e7}.training h2{margin:6px 0 8px}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;padding:13px 8px;display:flex;justify-content:space-around;z-index:9}.nav b{font-size:13px;text-align:center}
</style></head><body><main class="app"><span class="date" id="dateLabel"></span><h1>今天</h1>
<section class="hero"><div class="muted">今天还可以吃</div><div class="big"><span id="remain">2250</span><small style="font-size:23px;color:#aaa"> kcal</small></div><div class="bar"><i id="progress"></i></div><div class="stats"><div class="stat"><span class="muted">已摄入</span><b><span id="eaten">0</span> kcal</b></div><div class="stat"><span class="muted">蛋白质还差</span><b><span id="proteinLeft">155</span> g</b></div></div></section>

<section class="card"><h2>手动记录饮食</h2><input id="foodText" class="foodinput" placeholder="例如：鸡胸肉200g 米饭150g 西兰花200g"><div class="hint">不用拍照。直接输入“食物 + 份量”，系统在本机计算热量和营养，不产生任何识别费用。也支持“鸡蛋2个、香蕉1根、牛奶250ml”。</div><div class="row"><button class="btn" onclick="foodText.value=''">清空</button><button class="btn dark" onclick="judgeFood()">分析这顿</button></div><div class="result" id="result"><span class="tag" id="judgeTag"></span><h3 id="judgeTitle"></h3><div id="judgeDesc" class="muted"></div><div class="macro"><div><small>热量</small><b id="rKcal">0</b><small>kcal</small></div><div><small>蛋白质</small><b id="rProtein">0</b><small>g</small></div><div><small>碳水</small><b id="rCarbs">0</b><small>g</small></div></div><button class="btn dark" style="width:100%;margin-top:14px" onclick="saveAnalyzed()">确认计入今天</button></div></section>

<section class="card"><h2>今天已记录</h2><div id="mealList" class="list"><div class="muted">还没有记录</div></div></section>
<section class="card tip"><h3 style="margin-top:0">今天先保证蛋白质</h3><div class="muted">优先鸡肉、牛肉、鱼虾、鸡蛋、牛奶、豆制品；高油、高糖食物不是不能吃，主要控制份量和全天总热量。</div></section>
<h2 style="margin-top:28px">今天训练</h2><section class="card training"><div class="muted">周二</div><h2>Zone 2 骑车</h2><div class="muted">45–50分钟 · RPE 3–4/10</div></section>
</main><nav class="nav"><b>⌂<br>今天</b><b>◉<br>饮食</b><b>◆<br>训练</b><b>↗<br>进度</b></nav>
<script>
const target=2250,pt=155;
const db=[
{n:"鸡胸肉",a:["鸡胸","鸡肉"],k:165,p:31,c:0,f:3.6},{n:"鸡腿肉",a:["鸡腿"],k:181,p:24,c:0,f:8},{n:"牛肉",a:["瘦牛肉","牛里脊"],k:125,p:21,c:0,f:4},{n:"猪里脊",a:["瘦猪肉","里脊肉"],k:143,p:20,c:0,f:6},{n:"三文鱼",a:["鲑鱼"],k:208,p:20,c:0,f:13},{n:"虾",a:["虾仁","基围虾"],k:99,p:24,c:.2,f:.3},{n:"鸡蛋",a:["蛋"],k:72,p:6.3,c:.4,f:4.8,unit:"个"},{n:"豆腐",a:["嫩豆腐","老豆腐"],k:76,p:8,c:1.9,f:4.8},{n:"无糖酸奶",a:["酸奶"],k:63,p:4,c:7,f:2.5},{n:"牛奶",a:["纯牛奶"],k:61,p:3.2,c:4.8,f:3.3,ml:true},{n:"米饭",a:["白米饭","米"],k:116,p:2.6,c:25.9,f:.3},{n:"糙米饭",a:["糙米"],k:111,p:2.6,c:23,f:.9},{n:"面条",a:["面","挂面"],k:137,p:4.5,c:25,f:2.1},{n:"燕麦",a:["燕麦片"],k:389,p:16.9,c:66.3,f:6.9},{n:"红薯",a:["地瓜"],k:86,p:1.6,c:20.1,f:.1},{n:"玉米",a:["甜玉米"],k:106,p:4,c:19,f:2.3},{n:"全麦面包",a:["面包"],k:247,p:13,c:41,f:4.2},{n:"香蕉",a:["蕉"],k:105,p:1.3,c:27,f:.4,unit:"根"},{n:"苹果",a:[],k:95,p:.5,c:25,f:.3,unit:"个"},{n:"橙子",a:["橘子"],k:62,p:1.2,c:15.4,f:.2,unit:"个"},{n:"西兰花",a:["花椰菜"],k:34,p:2.8,c:6.6,f:.4},{n:"生菜",a:["青菜","蔬菜"],k:20,p:1.5,c:3,f:.2},{n:"番茄",a:["西红柿"],k:18,p:.9,c:3.9,f:.2},{n:"黄瓜",a:[],k:15,p:.7,c:3.6,f:.1},{n:"土豆",a:["马铃薯"],k:77,p:2,c:17,f:.1},{n:"饺子",a:["水饺"],k:230,p:9,c:30,f:8},{n:"包子",a:[],k:220,p:8,c:35,f:6},{n:"汉堡",a:["汉堡包"],k:260,p:13,c:30,f:10},{n:"炸鸡",a:["鸡排"],k:280,p:20,c:15,f:16},{n:"薯条",a:[],k:312,p:3.4,c:41,f:15},{n:"火锅肥牛",a:["肥牛"],k:250,p:18,c:0,f:20},{n:"五花肉",a:[],k:395,p:14,c:0,f:37},{n:"奶茶",a:[],k:450,p:5,c:75,f:14,unit:"杯"},{n:"可乐",a:["汽水"],k:140,p:0,c:35,f:0,unit:"罐"},{n:"豆浆",a:[],k:33,p:3,c:1.8,f:1.6,ml:true}
];
function localDate(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
const key="ckMeals-"+localDate();let meals=JSON.parse(localStorage.getItem(key)||"[]"),pending=null;
dateLabel.textContent=(new Date().getMonth()+1)+"月"+new Date().getDate()+"日";
function render(){let k=meals.reduce((a,x)=>a+(+x.kcal||0),0),p=meals.reduce((a,x)=>a+(+x.protein||0),0);eaten.textContent=Math.round(k);remain.textContent=Math.max(0,Math.round(target-k));proteinLeft.textContent=Math.max(0,Math.round(pt-p));progress.style.width=Math.min(100,k/target*100)+"%";mealList.innerHTML=meals.length?meals.map((m,i)=>`<div class="meal"><div><strong>${m.text}</strong><small>${Math.round(m.kcal)} kcal · 蛋白质 ${m.protein.toFixed(1)}g</small></div><button class="del" onclick="delMeal(${i})">删除</button></div>`).join(""):'<div class="muted">还没有记录</div>'}
function delMeal(i){meals.splice(i,1);localStorage.setItem(key,JSON.stringify(meals));render()}
function findFood(seg){let best=null,bl=0;for(const x of db){for(const n of [x.n,...x.a]){if(seg.includes(n)&&n.length>bl){best=x;bl=n.length}}}return best}
function qty(seg,item){
 let m;
 if(item.unit==="个"&&(m=seg.match(/(\d+(?:\.\d+)?)\s*个/))) return {factor:+m[1],label:m[1]+"个",serving:true};
 if(item.unit==="根"&&(m=seg.match(/(\d+(?:\.\d+)?)\s*根/))) return {factor:+m[1],label:m[1]+"根",serving:true};
 if(item.unit==="杯"&&(m=seg.match(/(\d+(?:\.\d+)?)\s*杯/))) return {factor:+m[1],label:m[1]+"杯",serving:true};
 if(item.unit==="罐"&&(m=seg.match(/(\d+(?:\.\d+)?)\s*罐/))) return {factor:+m[1],label:m[1]+"罐",serving:true};
 if((m=seg.match(/(\d+(?:\.\d+)?)\s*(g|克)/i))) return {factor:+m[1]/100,label:m[1]+"g"};
 if(item.ml&&(m=seg.match(/(\d+(?:\.\d+)?)\s*(ml|毫升)/i))) return {factor:+m[1]/100,label:m[1]+"ml"};
 return item.unit?{factor:1,label:"1"+item.unit,serving:true}:{factor:1,label:"100g"};
}
function judgeFood(){
 const text=foodText.value.trim();if(!text)return alert("先输入食物和份量");
 const segs=text.split(/[+＋,，、;；\n]/).flatMap(x=>x.trim().split(/\s+(?=[\u4e00-\u9fa5])/)).filter(Boolean);
 let items=[],unknown=[];
 for(const seg of segs){const item=findFood(seg);if(!item){unknown.push(seg);continue}const q=qty(seg,item);items.push({name:item.n,label:q.label,k:item.k*q.factor,p:item.p*q.factor,c:item.c*q.factor,f:item.f*q.factor})}
 if(!items.length){result.style.display="block";judgeTag.textContent="未匹配";judgeTitle.textContent="暂时没有这个食物";judgeDesc.textContent="可以换一个更常见的名称，或把包装上的每100g热量和蛋白质手动告诉我后再记录。";rKcal.textContent=rProtein.textContent=rCarbs.textContent="—";pending=null;return}
 const total=items.reduce((a,x)=>({k:a.k+x.k,p:a.p+x.p,c:a.c+x.c,f:a.f+x.f}),{k:0,p:0,c:0,f:0});
 const eatenNow=meals.reduce((a,x)=>a+x.kcal,0),remainNow=target-eatenNow;
 let tag,title,desc;
 if(total.k>Math.max(700,remainNow*.55)){tag="注意份量";title="这顿热量偏高";desc="不是不能吃，但这顿会占掉今天很大一部分热量，建议减少高油主食/炸物的份量。"}
 else if(total.p>=30&&total.k<=650){tag="适合减脂";title="这顿结构不错";desc="蛋白质够、总热量也比较容易控制，比较符合你现在减脂保肌的目标。"}
 else if(total.p<20&&total.k>350){tag="蛋白质偏低";title="能吃，但建议补蛋白质";desc="这顿热量不算低，但蛋白质偏少，可以加鸡肉、牛肉、鱼虾、鸡蛋、牛奶或豆制品。"}
 else{tag="可以吃";title="关键看全天总量";desc="这顿没有明显问题，继续控制全天总热量，并把蛋白质补到目标附近即可。"}
 if(unknown.length)desc+=" 未识别："+unknown.join("、")+"。";
 judgeTag.textContent=tag;judgeTitle.textContent=title;judgeDesc.textContent=desc;rKcal.textContent=Math.round(total.k);rProtein.textContent=total.p.toFixed(1);rCarbs.textContent=total.c.toFixed(1);
 pending={text,kcal:total.k,protein:total.p,carbs:total.c,fat:total.f,items};result.style.display="block";
}
function saveAnalyzed(){if(!pending)return alert("先分析这顿");meals.push({...pending,time:Date.now()});localStorage.setItem(key,JSON.stringify(meals));foodText.value="";result.style.display="none";pending=null;render()}
render();
</script></body></html>
